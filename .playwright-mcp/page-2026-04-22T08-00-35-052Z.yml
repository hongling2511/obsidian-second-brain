          - paragraph [ref=e222]: 接下来，我们探讨 Codex 如何为对话中的第一次推理调用创建提示。
          - heading "构建初始提示" [level=4] [ref=e226]
          - paragraph [ref=e228]: 作为最终用户，你在查询 Responses API 时，并不需要逐字输入用于对模型进行采样的提示。取而代之的是，你只需在查询中指定各类输入，Responses API 服务器会负责将这些信息组织成模型可接受的提示结构。你可以将提示理解为一个“项目列表”；本节将阐述你的查询如何被转换为此列表。
          - paragraph [ref=e230]:
            - text: 在初始提示中，列表内的每个项目都关联一个角色。
            - code [ref=e232]: 角色
