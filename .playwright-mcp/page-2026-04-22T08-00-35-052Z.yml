          - paragraph [ref=e97]:
            - link "Codex CLI⁠ （在新窗口中打开）" [ref=e98] [cursor=pointer]:
              - /url: https://developers.openai.com/codex/cli
              - generic [ref=e99]: Codex CLI
              - text: ⁠
              - generic [ref=e100]: （在新窗口中打开）
            - text: 是我们打造的跨平台本地软件智能体，其设计宗旨是在你的计算机上安全、高效地运行，并交付高质量、可靠的软件变更。
            - link "自四月首次发布该 CLI 以来⁠" [ref=e101] [cursor=pointer]:
              - /url: https://openai.com/index/introducing-o3-and-o4-mini/
              - generic [ref=e102]: 自四月首次发布该 CLI 以来
              - text: ⁠
            - text: ，我们在构建先进软件智能体方面积累了丰富经验。为分享这些收获与思考，我们推出了本系列文章。作为开篇之作，本文将深入解析 Codex 的运作机制与核心原理，并分享我们在实践中积累的经验。（如需详细了解 Codex CLI 的底层实现细节，请查看我们的开源仓库：
            - link "https://github.com/openai/codex⁠ （在新窗口中打开）" [ref=e103] [cursor=pointer]:
              - /url: https://github.com/openai/codex
              - generic [ref=e104]: https://github.com/openai/codex
              - text: ⁠
              - generic [ref=e105]: （在新窗口中打开）
            - text: 。我们的许多设计决策细节都记录在 GitHub 的议题和 Pull Request 中，可供深入查阅。）
          - paragraph [ref=e107]:
            - text: 首先，我们将聚焦于
            - generic [ref=e108]: 智能体循环
            - text: — 这是 Codex CLI 的核心逻辑，负责协调用户、模型以及模型为执行任务所调用的工具三者之间的交互。希望本文能帮助你全面理解我们的智能体（或称“运行框架”）在运用大语言模型（LLM）时所发挥的关键作用。
          - paragraph [ref=e110]:
            - text: 在深入之前，先简单说明一下术语：在 OpenAI，“Codex”是指一系列软件智能体产品，包括 Codex CLI、Codex Cloud 和 Codex VS Code 扩展。本文重点探讨 Codex 的
            - generic [ref=e111]: 运行框架
            - text: 。它提供了核心的智能体循环与执行逻辑，是所有 Codex 体验的基石，并通过 Codex CLI 对外提供。为行文简洁，下文将交替使用“Codex”与“Codex CLI”。
          - heading "智能体循环" [level=2] [ref=e115]
          - paragraph [ref=e117]: 对任何一个 AI 智能体来说，其核心都是一套称为“智能体循环”的运行机制。其简化示意如下图所示：
          - figure [ref=e119]:
            - img "标题为“Agent loop”的示意图，展示了 AI 系统如何处理用户请求、调用工具、观察结果、更新计划并返回输出。箭头连接用户输入、模型推理、工具操作和最终响应等步骤。" [ref=e127]
          - paragraph [ref=e129]:
            - text: 首先，智能体接收用户
            - generic [ref=e130]: 输入
            - text: ，并将其整合为一系列为可供模型使用的文本指令，这一系列指令称为
            - generic [ref=e131]: 提示
            - text: 。
          - paragraph [ref=e133]:
            - text: 接着，智能体将指令发送给模型，并要求模型生成响应，这个过程称为
            - generic [ref=e134]: 推理
            - text: 。在推理过程中，文本提示首先被转换为一串输入
            - link "Token⁠ （在新窗口中打开）" [ref=e135] [cursor=pointer]:
              - /url: https://platform.openai.com/docs/concepts#tokens
              - generic [ref=e136]: Token
              - text: ⁠
              - generic [ref=e137]: （在新窗口中打开）
            - text: — 这些 Token 是用于索引模型词汇表的整数值。随后，这些 Token 被用于对模型进行采样，从而生成一串新的输出 Token。
          - paragraph [ref=e139]: 输出 Token 会转换回文本作为模型响应。由于 Token 是逐次生成的，转换过程可以与模型运行同步进行，因此许多大语言模型应用能实现流式输出。实际应用中，推理过程通常封装在一个处理文本的 API 内部，从而对使用者隐藏了 Token 化的细节。
          - paragraph [ref=e141]:
            - text: 推理步骤完成后，模型可能产生两种结果：(1) 生成对用户原始输入的最终响应；或 (2) 请求智能体执行一次
            - generic [ref=e142]: 工具调用
            - text: （例如，“运行
            - code [ref=e144]: ls
            - text: 命令并返回结果”）。若是情况 (2)，智能体则执行所请求的工具调用，并将工具执行的结果追加到原始提示中。工具的输出结果将用于生成新的输入，并再次提交给模型；智能体基于这个更新后的上下文，开始新一轮推理。
          - paragraph [ref=e146]:
            - text: 此过程循环往复，直至模型不再发起工具调用，转而生成一条面向用户的消息（在 OpenAI 模型中称为
            - generic [ref=e147]: 助手消息
            - text: ）。多数情况下，此消息会直接回应用户的初始请求，但也可能是一个向用户提出的追问。
          - paragraph [ref=e149]:
            - text: 由于智能体能够执行会修改本地环境的工具调用，因此其“输出”并不局限于助手消息本身。在许多场景下，软件智能体最主要的“输出”，其实是它在你计算机上直接编写或修改的代码。然而，每一轮交互最终都会由一条助手消息来结束，例如“你要求的
            - code [ref=e151]: architecture.md
            - text: 文件已添加”，这标志着智能体循环达到终止状态。从智能体的视角来看，其任务已告完成，控制权也随之交还给用户。
          - paragraph [ref=e153]:
            - text: 图中所示的从
            - generic [ref=e154]: 用户输入
            - text: 到
            - generic [ref=e155]: 智能体响应
            - text: 的完整过程，被称为一次对话
            - generic [ref=e156]: 轮次
            - text: （在 Codex 中也称为一个
            - generic [ref=e157]: 对话线程
            - text: ）。需要注意的是，一次
            - generic [ref=e158]: 对话轮次
            - text: 可能包含
            - generic [ref=e159]: 模型推理
            - text: 与
            - generic [ref=e160]: 工具调用
            - text: 之间的多次循环迭代。每当你向既有对话发送新消息时，包括之前所有轮次的消息与工具调用在内的完整对话历史，都会被纳入新轮次的提示中：
          - figure [ref=e162]:
            - img "标题为“Multi-turn agent loop”的图示，展示 AI 智能体如何迭代地接收用户输入、生成行动、咨询工具、更新状态并返回结果。图示包含带标签的步骤、箭头以及展示智能体推理循环的示例工具输出。" [ref=e170]
          - paragraph [ref=e172]:
            - text: 这意味着，随着对话的推进，用于模型采样的提示也会越来越长。提示长度至关重要，因为每个模型都有一个
            - generic [ref=e173]: 上下文窗口
            - text: ，即其单次推理调用所能处理的最大 Token 数。需要注意，此窗口的容量同时涵盖了输入
            - generic [ref=e174]: 与
            - text: 输出 Token。可以想象，智能体在单轮交互中可能发起数百次工具调用，因此存在耗尽上下文窗口的风险。正因如此，
            - generic [ref=e175]: 上下文窗口管理
            - text: 便成了智能体的核心职责之一。现在，让我们深入 Codex 内部，看其如何运行智能体循环。
          - heading "模型推理" [level=2] [ref=e179]
