        - generic [ref=e95]:
          - paragraph [ref=e97]:
            - text: OpenAI 的编码智能体 Codex 部署于多个不同的平台：
            - link "Web 应用⁠ （在新窗口中打开）" [ref=e98] [cursor=pointer]:
              - /url: https://chatgpt.com/codex
              - text: Web 应用⁠
              - generic [ref=e99]: （在新窗口中打开）
            - text: 、
            - link "CLI⁠ （在新窗口中打开）" [ref=e100] [cursor=pointer]:
              - /url: https://github.com/openai/codex
              - text: CLI⁠
              - generic [ref=e101]: （在新窗口中打开）
            - text: 、
            - link "IDE 扩展⁠ （在新窗口中打开）" [ref=e102] [cursor=pointer]:
              - /url: https://developers.openai.com/codex/ide/
              - text: IDE 扩展⁠
              - generic [ref=e103]: （在新窗口中打开）
            - text: ，以及
            - link "新的 Codex macOS 应用" [ref=e104] [cursor=pointer]:
              - /url: /index/introducing-the-codex-app/
            - text: 。其底层架构均由同一个 Codex 运行框架驱动 — 支撑着所有 Codex 体验的智能体循环和逻辑。它们之间有何重要关联？
            - link "Codex App Server⁠ （在新窗口中打开）" [ref=e105] [cursor=pointer]:
              - /url: https://developers.openai.com/codex/app-server
              - text: Codex App Server⁠
              - generic [ref=e106]: （在新窗口中打开）
            - text: 是客户端友好型双向 JSON-RPC
            - superscript [ref=e107]:
              - link "1" [ref=e109] [cursor=pointer]:
                - /url: "#citation-bottom-1"
            - text: API。
          - paragraph [ref=e111]: 在这篇文章中，我们将介绍 Codex App Server，并分享我们迄今为止所掌握的经验，助你将 Codex 的功能引入产品，以便用户能够大幅提升工作流效率。我们将介绍 App Server 的架构和协议，及其如何与不同的 Codex 界面集成，并分享利用 Codex 的技巧；无论你是想让 Codex 充当代码审查员、SRE 智能体，还是编程助手，它都能助你一臂之力。
          - heading "App Server 的起源" [level=2] [ref=e115]
          - paragraph [ref=e117]: 在深入了解架构之前，不妨先看看 App Server 的背景故事。最初，App Server 是一种在不同产品中复用 Codex 运行框架的实用方法，后来逐渐演变为我们的标准协议。
          - paragraph [ref=e119]:
            - text: Codex CLI 最初曾作为 TUI（终端用户界面），这意味着你可以通过终端访问 Codex。当我们构建 VS Code 扩展（一种更适用于与 Codex 智能体交互的 IDE 友好型方案）时，我们需要应用相同的运行框架，在不重新实施的情况下，从 IDE 用户界面 (UI) 驱动相同的智能体循环。这意味着要支持超越请求/响应的丰富交互模式，例如探索工作空间、在智能体进行推理时流式传输进程，以及输出差异。我们最初尝试将
            - link "Codex 作为 MCP 服务器⁠ （在新窗口中打开）" [ref=e120] [cursor=pointer]:
              - /url: https://github.com/openai/codex/pull/2264
              - text: Codex 作为 MCP 服务器⁠
              - generic [ref=e121]: （在新窗口中打开）
            - text: 对外发布，但我们发现难以运用 VS Code 方案来维护 MCP 语义。相反，我们引入了一个类似 TUI 循环的 JSON-RPC 协议，它成为了 App Server 的
            - link "非官方首发版本⁠ （在新窗口中打开）" [ref=e122] [cursor=pointer]:
              - /url: https://github.com/openai/codex/pull/4471
              - text: 非官方首发版本⁠
              - generic [ref=e123]: （在新窗口中打开）
            - text: 。当时，我们并未预料到其他客户会选择 App Server，因为其设计初衷并非是构建稳定的 API。
          - paragraph [ref=e125]: 在接下来的几个月里，随着 Codex 的应用率不断增长，内部团队和外部合作伙伴希望能够在其自研产品中嵌入同一个运行框架，以加速其用户的软件开发工作流。例如，JetBrains 和 Xcode 希望获得 IDE 级智能体体验，而 Codex 桌面应用则需要并行编排多个 Codex 智能体。这些需求促使我们设计了一个平台界面，确保我们的产品和合作伙伴集成能够基于该平台实现长期稳定运行。它既要易于集成，又要向后兼容，这意味着我们可以在不破坏现有客户端的情况下优化该协议。
          - paragraph [ref=e127]: 接下来，我们将逐步介绍如何设计相关架构和协议，以便不同的客户端可以应用同一个运行框架。
          - heading "在 Codex 运行框架内" [level=2] [ref=e131]
          - paragraph [ref=e133]:
            - text: 首先，让我们聚焦于 Codex harness 内部的运行框架，以及 Codex App Server 如何向客户端呈现这一框架。在上一篇 Codex
            - link "博客" [ref=e134] [cursor=pointer]:
              - /url: /index/unrolling-the-codex-agent-loop/
            - text: 中，我们拆解了用于协调用户、模型和工具间交互的核心智能体循环。这正是 Codex 运行框架的核心逻辑，但完整的智能体体验远不止于此：
          - paragraph [ref=e136]:
            - generic [ref=e137]: 1. 线程生命周期和持久性
            - text: 。线程是用户与智能体间的 Codex 对话。Codex 可创建、恢复、派生和归档线程，并持久保存事件历史记录，以便客户端重新连接并呈现一致的时间线。
          - paragraph [ref=e139]:
            - generic [ref=e140]: 2. 配置和身份验证
            - text: 。Codex 可加载配置、管理默认值，并运行“使用 ChatGPT 登录”等身份验证流程，包括凭据状态。
          - paragraph [ref=e142]:
            - generic [ref=e143]: 3. 工具执行和扩展
            - text: 。Codex 可在沙盒中执行 shell/文件工具，并连接 MCP 服务器和技能等集成，从而根据一致的策略模式参与智能体循环。
          - paragraph [ref=e145]:
            - text: 我们在此提到的所有智能体逻辑（包括核心智能体循环），都位于 Codex CLI 代码库中名为“
            - link "Codex 核心⁠ （在新窗口中打开）" [ref=e146] [cursor=pointer]:
              - /url: https://github.com/openai/codex/tree/main/codex-rs/core
              - text: Codex 核心⁠
              - generic [ref=e147]: （在新窗口中打开）
            - text: ”的模块内。“Codex 核心”既是一个存放所有智能体代码的存储库，也是一个可启动的运行时环境，可用于运行智能体循环并管理 Codex 线程（对话）的持久性。
          - paragraph [ref=e149]: 为了发挥效力，Codex 运行框架需要授予客户端访问权限。这正是 App Server 的“用武之地”。
          - figure [ref=e151]:
            - img "标题为“应用服务器流程”的示意图。客户端会将 JSON-RPC 消息发送到 stdio 读取器，该读取器则会将请求分派给 Codex 消息处理器。处理器会通过查找线程、线程句柄、提交的请求和事件/更新，与线程管理器和核心线程交互，然后将响应返回给客户端。" [ref=e159]
          - paragraph [ref=e161]: App Server 既是客户端与服务器间的 JSON-RPC 协议，也是托管 Codex 核心线程的长期进程。如上图所示，App Server 进程包含四个主要组件：stdio 读取器、Codex 消息处理器、线程管理器和核心线程。线程管理器可为每个线程启动一个核心会话，Codex 消息处理器则可直接与每个核心会话通信，以提交客户端请求并接收更新。
          - paragraph [ref=e163]: 一个客户端请求可能会导致多个事件更新，正是这些详细的事件支持我们在 App Server 上构建丰富的用户界面。此外，stdio 读取器和 Codex 消息处理器可作为客户端与 Codex 核心线程间的转换层。它们可将客户端 JSON-RPC 请求转换为 Codex 核心操作，监听 Codex 核心的内部事件流，然后将这些低级事件转换为一小组稳定的用户界面就绪型 JSON-RPC 通知。
          - paragraph [ref=e165]: 客户端与 App Server 间的 JSON-RPC 协议处于完全双向模式。典型的线程包含一个客户端请求和多个服务器通知。此外，当智能体需要输入（例如审批）时，服务器可以发起请求，然后暂停该轮次，直到客户端响应。
          - heading "对话原语" [level=2] [ref=e169]
          - paragraph [ref=e171]: 接下来，我们将拆解对话原语，即 App Server 协议的构建模块。为智能体循环设计 API 颇为棘手，因为用户/智能体交互并非简单的请求/响应。一个用户请求可能会展开为一系列结构化的操作序列，客户端需要忠实呈现相应信息：用户的输入、智能体的增量进度，以及在此过程中产生的工件（例如，差异文件）。为了确保交互流易于集成并在各种用户界面中保持弹性，我们确定了三个包含明确边界和生命周期的核心原语：
          - paragraph [ref=e173]:
            - generic [ref=e174]: 1. 项目：
            - text: 项目是 Codex 中输入/输出的基本单位。各个项目都有相应的类型（例如，用户消息、智能体消息、工具执行、审批请求、差异），并且每一个项目都有明确的生命周期：
          - list [ref=e176]:
            - listitem [ref=e177]:
              - code [ref=e179]: item/started
              - text: ：当项目开始时
            - listitem [ref=e180]:
              - text: 可选的
              - code [ref=e182]: item/*/delta
              - text: 事件：作为内容流输入（用于流式项目类型）
            - listitem [ref=e183]:
              - code [ref=e185]: item/completed
              - text: ：当项目完成其终端负载时
          - paragraph [ref=e187]:
            - text: 此生命周期允许客户端在
            - code [ref=e189]: started
            - text: 时立即开始渲染，在
            - code [ref=e191]: delta
            - text: 时流式传输增量更新，并在
            - code [ref=e193]: completed
            - text: 时最终完成处理。
          - paragraph [ref=e195]:
            - generic [ref=e196]: 2. 轮次
            - text: ：轮次是由用户输入发起的智能体工作单位。当客户端提交输入（例如，“运行测试并总结失败”）时，轮次就会启动；当智能体为该输入生成输出时，轮次就会终止。一个轮次包含一系列项目，这些项目代表了在此过程中产生的中间步骤和输出结果。
          - paragraph [ref=e198]:
            - generic [ref=e199]: 3. 线程
            - text: ：线程是用户与智能体间正在进行的 Codex 会话的持久容器。它包含多个轮次。线程可以被创建、恢复、派生和归档。线程历史记录会被持久化保存，以便客户端重新连接并呈现一致的时间线。
          - paragraph [ref=e201]: 现在，我们来看看客户端和智能体间的简化对话，该对话由原语表示：
          - figure [ref=e203]:
            - img "标注为“客户端-服务器协议消息流：初始化握手”的示意图。客户端会向服务器发送一个包含 clientInfo 的初始化请求。服务器会返回一个包含 userAgent 字符串“my_client/1.0”的结果事件。" [ref=e211]
          - paragraph [ref=e213]:
            - text: 在对话开始时，客户端和服务器需要建立
            - code [ref=e215]: initialize
            - text: 握手。客户端必须在调用任何其他方法前发送一个
            - code [ref=e217]: initialize
            - text: 请求，服务器会通过响应进行确认。这样，服务器就能展现自己的能力，并确保双方在真正投入运行前就协议版本、功能标志和默认值达成一致。以下是 OpenAI VS Code 扩展的负载示例：
          - generic [ref=e221]:
            - generic [ref=e222]:
              - heading "JSON" [level=4] [ref=e223]
              - button "复制代码块" [ref=e224] [cursor=pointer]:
