          - figure [ref=e296]:
            - img "标题为“客户端-服务器协议消息流：线程与轮次生命周期”的示意图。客户端会向服务器发送 thread/start 和 turn/start 请求。服务器会触发事件（thread/started、turn/started、item/started 和 item/completed），并显示用户消息为“运行测试并总结失败”的轮次。" [ref=e304]
          - paragraph [ref=e306]:
            - text: 当客户端发起新请求时，它会先创建一个线程，然后创建一个轮次。服务器将返回进度通知（
            - code [ref=e308]: thread/started
            - text: 和
            - code [ref=e310]: turn/started
            - text: ）。它还会返回自身识别为项目的输入，比如此示例中的用户消息。
          - figure [ref=e312]:
            - img "标题为“客户端-服务器协议消息流：包含审批选项的工具执行”的示意图。在工具调用期间，服务器会发出 item/started，然后发出 item/commandExecution/requestApproval，并说明原因（“运行测试”）。客户端会返回一个审批事件（允许/拒绝）。然后，服务器会发出 item/completed，显示命令执行（“pnpm test”）。" [ref=e320]
          - paragraph [ref=e322]: 工具调用也会作为项目发送回客户端。此外，服务器在执行操作之前，可能会通过发送服务器请求来请求客户端进行审批。审批将暂停该轮次，直到客户端回复“允许”或“拒绝”。VS Code 扩展中的审批流程如下：
          - figure [ref=e324]:
            - img "深色主题界面中的权限提示：“Do you want to allow me to run pnpm test for this workspace?”它列出了以下选项：1) 是；2) 是，且不再询问以 pnpm test 开头的命令；3) 否，且底部设有提交按钮。" [ref=e331]
          - figure [ref=e333]:
            - img "标题为“客户端-服务器协议消息流：流式传输智能体消息流”的示意图。服务器会将助理消息流划分为几个部分：item/started、两个 agentMessage/delta 事件（“已运行 3 次测试”、“全部通过”），以及 item/completed。该轮次则以 turn/completed 收尾。" [ref=e341]
          - paragraph [ref=e343]:
            - text: 最后，服务器会发送一条智能体消息，然后以
            - code [ref=e345]: turn/completed
            - text: 结束该轮次。智能体消息增量事件会持续流式返回消息片段，直到消息以
            - code [ref=e347]: item/completed
            - text: 收尾。
          - paragraph [ref=e349]: 为便于理解，示意图中的信息已经过简化。如果你想查看完整轮次的 JSON，可以从 Codex CLI 代码仓库运行测试客户端：
          - generic [ref=e353]:
            - generic [ref=e354]:
              - heading "Bash" [level=4] [ref=e355]
              - button "复制代码块" [ref=e356] [cursor=pointer]:
                - img [ref=e357]
            - code [ref=e360]:
              - generic [ref=e362]:
                - generic [ref=e363]: "1"
                - generic [ref=e364]: codex debug app-server send-message-v2 "run tests and summarize failures"
          - heading "与客户端集成" [level=2] [ref=e368]
          - paragraph [ref=e370]: 现在，让我们看看不同的客户端界面如何通过 App Server 嵌入 Codex。我们将介绍三种模式：本地应用和 IDE、Codex Web 运行时，以及 TUI。
          - figure [ref=e372]:
            - img "标题为“Codex 客户端通过应用服务器与 Codex 运行框架集成”的示意图。第一方客户端（Codex 桌面应用、TUI/CLI、Web Runtime）和第三方集成（JetBrains IDE、VS Code、Xcode）通过 JSON-RPC 调用与 Codex 运行框架进行通信。" [ref=e380]
          - paragraph [ref=e382]: 在上述三种模式中，传输方式均为 JSON-RPC over stdio (JSONL)。JSON-RPC 可助你使用所选的语言，轻松构建客户端绑定。Codex 界面和合作伙伴集成已在 Go、Python、TypeScript、Swift 和 Kotlin 等多种语言中部署 App Server 客户端。对于 TypeScript，你可以通过运行以下命令直接从 Rust 协议生成定义：
          - generic [ref=e386]:
            - generic [ref=e387]:
              - heading "Bash" [level=4] [ref=e388]
              - button "复制代码块" [ref=e389] [cursor=pointer]:
                - img [ref=e390]
            - code [ref=e393]:
              - generic [ref=e395]:
                - generic [ref=e396]: "1"
                - generic [ref=e397]: codex app-server generate-ts
          - paragraph [ref=e399]: 对于其他语言，你可以生成一个 JSON 模式捆绑包，并通过运行以下命令将其输入到你首选的代码生成器中：
          - generic [ref=e403]:
            - generic [ref=e404]:
              - heading "Bash" [level=4] [ref=e405]
              - button "复制代码块" [ref=e406] [cursor=pointer]:
                - img [ref=e407]
            - code [ref=e410]:
              - generic [ref=e412]:
                - generic [ref=e413]: "1"
                - generic [ref=e414]: codex app-server generate-json-schema
          - heading "本地应用和 IDE" [level=5] [ref=e418]
          - figure [ref=e420]:
            - img "VS Code 的屏幕截图，图中包含正在运行的 Codex 扩展。Rust 测试文件已打开，其下方的 Codex 面板显示仅运行 fmt 和 cargo test -p codex-app-server 的描述，表明格式化和测试正在进行中，需等待通过/失败的最终结果。" [ref=e427]
          - paragraph [ref=e429]: 本地客户端通常会捆绑或获取特定平台的 App Server 二进制文件，将其作为一个长期运行的子进程启动，并为 JSON-RPC 开通一个双向 stdio 通道。例如，在我们的 VS Code 扩展和桌面应用中，随附的工件包含特定平台的 Codex 二进制文件，并固定为已测试版本，以便客户端始终运行与验证完全一致的代码。
          - paragraph [ref=e431]: 并非所有集成都能频繁发布客户端更新。部分合作伙伴（如 Xcode）通过保持客户端稳定，并在需要时允许其指向更新的 App Server 二进制文件，解耦发布周期。这样一来，他们就可以应用服务器端的优化（例如，Codex 核心中更好的自动压缩或新的支持配置键），并推出错误修复程序，而无需等待客户端发布。App Server 的 JSON-RPC 接口采用向后兼容设计，因此旧版客户端可以安全地与新版服务器通信。
          - heading "Codex Web" [level=5] [ref=e435]
          - figure [ref=e437]:
            - img "Codex Web 界面的屏幕截图：显示标题为“更新登录成功消息”的更新内容。左侧面板汇总了变更、测试和已修改的文件，右侧面板则展示了 login.rs 的代码差异，且包含“更新登录成功消息”字样。" [ref=e444]
          - paragraph [ref=e446]:
            - text: Codex Web 使用 Codex 运行框架，但其在容器环境中运行。工作节点会提供一个包含已签出工作空间的容器，在其中启动 App Server 二进制文件，并通过 stdio
            - superscript [ref=e447]:
              - link "2" [ref=e449] [cursor=pointer]:
                - /url: "#citation-bottom-2"
            - text: 通道维护长期运行的 JSON-RPC。Web 应用（在用户的浏览器标签页中运行）通过 HTTP 和 SSE 与 Codex 后端对话，后者则会流式传输由工作节点生成的任务事件。这样既能保持浏览器端用户界面的轻量化状态，又能在桌面和 Web 端保持一致的运行时。
          - paragraph [ref=e451]: 由于网页会话为临时性质（标签页关闭、网络中断），因此 Web 应用不能作为长期任务的可信数据源。在服务器上保留状态和进度意味着，即使标签页消失，任务也会继续运行。流式传输协议和已保存的线程会话可支持新会话轻松实现重新连接、从中断处继续运行，并快速同步状态，而无需在客户端内重建状态。
          - heading "TUI/Codex CLI" [level=5] [ref=e455]
          - figure [ref=e457]:
            - img "运行 Codex CLI 的终端屏幕截图。图中显示了包含 gpt-5.2-codex medium 模型的 OpenAI Codex 横幅、“为我解释应用服务器的原理”字样的用户命令以及“正在运行”状态。图片下方则显示“为 @filename 编写测试”字样的建议，且包含快捷方式选项。" [ref=e464]
          - paragraph [ref=e466]: 就传统意义而言，TUI 是一个“原生”客户端，它在与智能体循环相同的进程中运行，且直接与 Rust 核心类型通信，而非使用应用服务器协议。这有助于提高早期迭代速度，同时也会让 TUI 成为特殊的界面。
          - paragraph [ref=e468]:
            - text: 既然 App Server 已经存在，我们计划
            - link "重构 TUI⁠ （在新窗口中打开）" [ref=e469] [cursor=pointer]:
              - /url: https://github.com/openai/codex/pull/10192
              - text: 重构 TUI⁠
              - generic [ref=e470]: （在新窗口中打开）
            - text: 以投入实际应用，确保其发挥类似于其他客户端的作用：启动一个 App Server 子进程，通过 stdio 进行 JSON-RPC 通信，并渲染相同的流式事件和审批。这样一来，TUI 就可以连接远程设备上运行的 Codex 服务器，确保智能体部署于接近计算资源的位置，即使笔记本电脑休眠或断开连接也能继续运行，同时还能在本地实现实时更新和控制。
          - heading "选择合适的协议" [level=2] [ref=e474]
          - paragraph [ref=e476]: Codex App Server 将是我们今后维护的首要集成方案，但也有其他功能较为有限的方法。默认情况下，我们建议客户使用 Codex App Server 与 Codex 集成，借鉴其他集成方法并深入研究其优缺点。以下是驱动 Codex 的最常见方式，以及每种方式的应用场景。
          - heading "JSON-RPC 协议" [level=4] [ref=e480]
          - heading "作为 MCP 服务器的 Codex" [level=5] [ref=e484]
          - paragraph [ref=e486]:
            - text: 运行
            - link "codex mcp-server⁠ （在新窗口中打开）" [ref=e487] [cursor=pointer]:
              - /url: https://developers.openai.com/codex/guides/agents-sdk/
              - code [ref=e489]: codex mcp-server
              - text: ⁠
              - generic [ref=e490]: （在新窗口中打开）
            - text: ，然后从任何支持 stdio 服务器的 MCP 客户端连接（例如，
            - link "OpenAI Agents SDK⁠ （在新窗口中打开）" [ref=e491] [cursor=pointer]:
              - /url: https://openai.github.io/openai-agents-js/
              - text: OpenAI Agents SDK⁠
              - generic [ref=e492]: （在新窗口中打开）
            - text: ）。如果你已构建基于 MCP 的工作流，并希望将 Codex 作为可调用的工具，那么这一方案就是理想选择。其缺点在于，你只能获取 MCP 公开的内容，因此依赖更丰富会话语义（例如，差异更新）的 Codex 特定交互可能无法通过 MCP 端点清晰映射。
          - heading "跨提供商智能体运行框架协议" [level=5] [ref=e496]
          - paragraph [ref=e498]:
            - text: 部分生态系统可面向多个模型提供商和运行时环境提供可移植接口。如果你需要借助抽象化来协调多个智能体，这就是一个不错的选择。其代价在于，这些协议往往趋同于通用的功能子集，这可能会使更丰富的交互难以表示，特别是当特定提供商的工具和会话语义至关重要时。这一领域正在迅速发展，我们预计，随着 OpenAI 不断探索用于表示真实智能体工作流的最佳原语，更多的通用标准也会相继涌现（
            - link "技能⁠ （在新窗口中打开）" [ref=e499] [cursor=pointer]:
              - /url: https://agentskills.io/home
              - text: 技能⁠
              - generic [ref=e500]: （在新窗口中打开）
            - text: 就是其中的典型案例）。
          - heading "Codex App Server" [level=5] [ref=e504]
          - paragraph [ref=e506]: 当你希望将完整的 Codex 运行框架以稳定的用户界面友好型事件流形式展示时，请选择 App Server。你将同时获得智能体循环的完整功能，以及其他支持功能，例如使用 ChatGPT 登录、模型发现和配置管理。其主要成本在于集成工作，因为你需要使用所选的语言构建客户端的 JSON-RPC 绑定。但实际上，如果你向 Codex 提供 JSON 模式和文档，它就能完成大量繁重的工作。与我们合作的许多团队都会使用 Codex 快速开发可用集成。
          - heading "嵌入 Codex 的其他方法" [level=4] [ref=e510]
          - heading "Codex Exec⁠ （在新窗口中打开）" [level=5] [ref=e514]:
            - link "Codex Exec⁠ （在新窗口中打开）" [ref=e515] [cursor=pointer]:
              - /url: https://developers.openai.com/codex/cli/reference/#codex-exec
              - text: Codex Exec⁠
              - generic [ref=e516]: （在新窗口中打开）
          - paragraph [ref=e518]: 一种轻量级、可编写脚本的 CLI 模式，适用于一次性任务和 CI 运行。它适用于自动化和管道场景，在这些场景中，你希望通过一条命令以非交互形式实现全程运行，为日志流式传输结构化输出，并在退出时发出明确的成功或失败信号。
          - heading "Codex SDK⁠ （在新窗口中打开）" [level=5] [ref=e522]:
            - link "Codex SDK⁠ （在新窗口中打开）" [ref=e523] [cursor=pointer]:
              - /url: https://developers.openai.com/codex/sdk/
              - text: Codex SDK⁠
              - generic [ref=e524]: （在新窗口中打开）
          - paragraph [ref=e526]: TypeScript 代码库，用于在你自己的应用程序中以编程方式控制本地 Codex 智能体。当你希望为服务器端工具和工作流提供原生库接口，而无需构建单独的 JSON-RPC 客户端时，它就是最佳选择。由于它比 App Server 更早发布，目前支持的语言较少，且覆盖范围也较小。如果开发人员有意了解相关信息，我们可能会添加更多封装 App Server 协议的 SDK，以便你的团队覆盖更多的运行框架界面，而无需编写 JSON-RPC 绑定。
          - heading "推进相关工作" [level=2] [ref=e530]
          - paragraph [ref=e532]: 在这篇文章中，我们分享了如何设计与智能体交互的新标准，以及如何将 Codex 运行框架转变为稳定的客户端友好型协议。我们介绍了 App Server 如何公开 Codex 核心，如何支持客户端驱动整个智能体循环，以及如何为 TUI、本地 IDE 集成和网络运行时等环境提供动力。
          - paragraph [ref=e534]:
            - text: 如果这激发了你将 Codex 集成至专属工作流的灵感，那么 App Server 值得一试。所有源代码都存放在 Codex CLI 开源
            - link "代码仓库⁠ （在新窗口中打开）" [ref=e535] [cursor=pointer]:
              - /url: https://github.com/openai/codex/blob/main/codex-rs/app-server/README.md
              - text: 代码仓库⁠
              - generic [ref=e536]: （在新窗口中打开）
            - text: 中。欢迎你分享反馈意见和功能建议。我们期望收到你的回复，并将继续面向所有用户推广智能体。
