            - generic [ref=e338]: 可读性
            - text: 进行了优化。就像团队会努力提升代码对新入职工程师的可导航性一样，我们的人类工程师的目标也是让智能体能够
            - generic [ref=e339]: 直接从代码仓库
            - text: 推理出完整的业务领域。
          - paragraph [ref=e341]: 从智能体的角度来看，它在运行时无法在情境中访问的任何内容都是不存在的。存储在 Google Docs、聊天记录或人们头脑中的知识都无法被系统访问。代码仓库本地的、已版本化的工件（例如，代码、Markdown、模式、可执行计划）就是它所能看到的全部。
          - figure [ref=e343]:
            - img "题为“智能体知识的局限性：Codex看不到的东西就不存在”的图表。Codex 的知识被展示为一个有边界的气泡。在其下方是不可见知识的示例 — Google Docs、Slack 消息，以及隐性的人类知识。箭头表示，要想让 Codex 看到这些信息，就必须将其以 Markdown 的形式编码到代码库中。" [ref=e351]
          - paragraph [ref=e353]: 我们了解到，随着时间的推移，我们需要将越来越多的情境推送到仓库中。那次让团队在架构模式上达成一致的 Slack 讨论？如果智能体无法发现它，那么它就会像迟了三个月入职的新员工一样，对其一无所知。
          - paragraph [ref=e355]: 为 Codex 提供更多情境意味着要组织和展示正确的信息，好令智能体能够基于这些信息进行推理，而不是用临时指令使其不堪重负。就像你会在产品原则、工程规范和团队文化（包括表情符号偏好）方面为新队友提供引导一样，将这些信息提供给智能体会带来更一致的输出。
          - paragraph [ref=e357]:
            - text: 这一框架明确了许多取舍。我们倾向于选择那些可以完全内化于在仓库中进行推理的依赖项和抽象。对智能体来说，通常被称为“枯燥”的技术，由于其可组合性、API 稳定性和在训练集里的表现，往往更容易建立模型。在某些情况下，让智能体重新实现部分功能子集比绕过公共库中不透明的上游行为更便宜。例如，我们没有引入通用的
            - code [ref=e359]: p-limit
            - text: 风格包，而是投入使用了我们自己的带并发的 map 辅助函数：它与我们的 OpenTelemetry 仪表紧密集成，具备 100% 的测试覆盖率，并且其行为完全符合我们的运行时预期。
          - paragraph [ref=e361]:
            - text: 将系统的更多部分转化为智能体可以检查、验证并直接修改的形式，可以直接提高杠杆效应 — 这不仅适用于 Codex，也适用于其他智能体（例如
            - link "Aardvark" [ref=e362] [cursor=pointer]:
              - /url: /zh-Hans-CN/index/introducing-aardvark/
              - generic [ref=e363]: Aardvark
            - text: ) 也在参与代码库的开发。
          - heading "规范架构与品味" [level=2] [ref=e367]
          - paragraph [ref=e369]:
            - text: 仅靠文档本身，是没法保持完全由智能体生成的代码库的连贯性的。
            - generic [ref=e370]: 通过强制执行不变量，而非对实施过程进行微观管理，我们令智能体能够快速交付，而且不会削弱基础。
            - text: 例如，我们要求 Codex
            - link "在边界处解析数据形状⁠ （在新窗口中打开）" [ref=e371] [cursor=pointer]:
              - /url: https://lexi-lambda.github.io/blog/2019/11/05/parse-don-t-validate/
              - generic [ref=e372]: 在边界处解析数据形状
              - text: ⁠
              - generic [ref=e373]: （在新窗口中打开）
            - text: ，但不规定具体实现方式（模型似乎偏好 Zod，但我们没有指定特定库）。
          - paragraph [ref=e375]:
            - text: 智能体在具有
            - link "严格边界和可预测结构⁠ （在新窗口中打开）" [ref=e376] [cursor=pointer]:
              - /url: https://bits.logic.inc/p/ai-is-forcing-us-to-write-good-code
              - generic [ref=e377]: 严格边界和可预测结构
              - text: ⁠
              - generic [ref=e378]: （在新窗口中打开）
            - text: 的环境中最为高效，因此我们围绕一个严格的架构模型构建了该应用。每个业务域都划分为一组固定的层，依赖方向经过严格验证，并且仅允许有限的一组边。这些约束是通过自定义的 linter（当然是由 Codex 生成的！）和结构测试机械地强制执行的。
          - paragraph [ref=e380]: 下图展示了规则：在每个业务领域内（例如应用设置），代码只能“向前”依赖于一组固定的层（Types → Config → Repo → Service → Runtime → UI）。横切关注点（认证、连接器、遥测、功能标志）通过一个单一的显式接口进入：Providers。其他任何内容都不被允许，并将通过自动化方式强制执行。
          - figure [ref=e382]:
            - img "题为“具有明确交叉界限的分层领域架构”的图表。在业务逻辑域内存在以下模块：Types → Config → Repo，以及 Providers → Service → Runtime → UI，底部是 App Wiring + UI。一个 Utils 模块位于界限之外，并向 Providers 提供输入。" [ref=e390]
          - paragraph [ref=e392]: 这种架构通常要等到你拥有数百名工程师时才会推迟。对于编码智能体来说，这是一个早期的先决条件：有了约束，速度才不会下降，架构才不会漂移。
          - paragraph [ref=e394]: 在实践中，我们通过自定义的代码检查器和结构测试来强制执行这些规则，并辅以一小组“品味不变式”。例如，我们通过自定义 lint 静态地强制执行结构化日志记录、模式和类型的命名约定、文件大小限制，以及特定平台的可靠性要求。由于这些 lint 是自定义的，我们编写错误信息时会在智能体情境中注入修复指令。
          - paragraph [ref=e396]: 在以人为本的工作流程中，这些规则可能会让人感到迂腐或束缚。有了智能体，它们就成了倍增器：一旦编码，它们就能立即应用于所有地方。
          - paragraph [ref=e398]: 同时，我们还明确指出了哪些地方需要限制，哪些地方不需要限制。这类似于领导一个大型工程平台组织：在中央层面强制执行边界，在本地层面允许自主权。你非常重视界限、正确性和可重复性。在这些边界内，你允许团队或智能体在解决方案的表达方式上拥有很大的自由。
          - paragraph [ref=e400]: 生成的代码不总是符合人类的风格偏好，这也没关系。只要输出是正确的、可维护的，并且对未来的智能体运行而言清晰易读，就可以算作达标。
          - paragraph [ref=e402]: 人类的品味会不断反馈到系统中。审查评论、重构的 Pull Request 和面向用户的 Bug 会被记录为文档更新，或直接编码到工具中。当文档不够完善时，我们会将规则转化为代码
          - heading "吞吐量改变了合并的理念" [level=2] [ref=e406]
          - paragraph [ref=e408]: 随着 Codex 的吞吐量增加，许多传统的工程规范变得不再有效。
          - paragraph [ref=e410]: 该代码仓库在运行过程中尽量减少阻塞合并门。Pull Request 的生命周期很短。测试偶发失败通常通过后续重跑来解决，而不是无限期地阻碍进展。在一个智能体吞吐量远超人类注意力的系统中，纠错成本低，而等待成本高。
          - paragraph [ref=e412]: 在低吞吐量环境中，这样做是不负责任的。而在这里，这通常是正确的选择。
          - heading "“智能体生成”实际上意味着什么" [level=2] [ref=e416]
          - paragraph [ref=e418]: 当我们说代码库是由 Codex 智能体生成的，我们指的是整个代码库。
          - paragraph [ref=e420]: 智能体的产出包括：
          - list [ref=e422]:
            - listitem [ref=e423]: 产品代码与测试
            - listitem [ref=e424]: CI 配置和发布工具
            - listitem [ref=e425]: 内部开发者工具
            - listitem [ref=e426]: 文档和设计历史
            - listitem [ref=e427]: 评估框架
            - listitem [ref=e428]: 审阅评论和回复
            - listitem [ref=e429]: 管理代码仓库本身的脚本
            - listitem [ref=e430]: 生产仪表板定义文件
          - paragraph [ref=e432]: 人类始终参与其中，但工作的抽象层次与过去不同。我们优先处理工作，将用户反馈转化为验收标准，并对结果进行验证。当智能体遇到困难时，我们将其视为一个信号：识别缺失的内容 — 工具、指导与约束、文档 — 并将其反馈到代码仓库中，始终由 Codex 自己编写修复。
          - paragraph [ref=e434]: 智能体可以直接使用我们的标准开发工具。他们会拉取审查反馈、在行内回复、推送更新，并且经常压缩并合并他们自己的 Pull Request（合并请求）。
          - heading "不断提高的自主水平" [level=2] [ref=e438]
          - paragraph [ref=e440]: 随着越来越多的开发环节被直接编码到系统中 — 包括测试、验证、审查、反馈处理和恢复 — 该代码仓库最近跨过了一个重要门槛，使 Codex 能够端到端地驱动一个新功能。
          - paragraph [ref=e442]: 给定一个提示，智能体现在可以：
          - list [ref=e444]:
            - listitem [ref=e445]: 验证代码库的当前状态
            - listitem [ref=e446]: 重现已报告的漏洞
            - listitem [ref=e447]: 录制一个演示故障的视频
            - listitem [ref=e448]: 实施修复措施
            - listitem [ref=e449]: 通过运行应用程序来验证修复
            - listitem [ref=e450]: 录制第二个视频，演示解决方案
            - listitem [ref=e451]: 打开 Pull Request
            - listitem [ref=e452]: 回应智能体和人类反馈
            - listitem [ref=e453]: 检测并修复构建故障
            - listitem [ref=e454]: 仅在需要判断时才交由人工处理
            - listitem [ref=e455]: 合并更改
          - paragraph [ref=e457]: 此行为在很大程度上取决于此代码仓库的具体结构和工具，不应在没有类似投入的情况下假定它可以泛化 — 至少目前还不行。
          - heading "熵与垃圾收集" [level=2] [ref=e461]
          - paragraph [ref=e463]:
            - generic [ref=e464]: 完全自主的智能体也引入了新的问题。
            - text: Codex 会复现代码仓库中已存在的模式 — 甚至包括那些不均衡或不够理想的模式。随着时间的推移，这不可避免地导致漂移。
          - paragraph [ref=e466]: 最初，人类是手动处理这个问题的。我们的团队过去每周五（占一周的20%）都要花时间清理“AI 残渣”。不出所料，那并不具备可扩展性。
          - paragraph [ref=e468]: 相反，我们开始将我们称为“黄金原则”的内容直接编码到代码仓库中，并建立了一个循环清理流程。这些原则是带有主观意见的机械规则，旨在保持代码库的可读性和一致性，以便将来运行智能体。例如：(1) 我们更倾向于使用共享的实用程序包，而不是手工编写的辅助工具，以便将不变式集中管理；(2) 我们不会使用“YOLO 式”探测数据 — 我们会验证边界，或依赖类型化的 SDK，这样智能体就不会意外地基于猜测的结构进行构建。我们会定期运行一组后台 Codex 任务，扫描偏差、更新质量等级，并发起有针对性的重构 Pull Request。其中大多数都可以在一分钟内完成审查并自动合并。
          - paragraph [ref=e470]: 其功能类似于垃圾回收。技术债务就像一笔高息贷款：不断地以小额贷款的方式偿还债务，总比让债务不断累积，再痛苦地一次解决要好得多。人类的品味一旦被捕捉，就会持续应用于每一行代码。这也使我们能够每天发现并解决不良模式，而不是让它们在代码库中传播数天或数周。
          - heading "我们仍在学习的内容" [level=2] [ref=e474]
          - paragraph [ref=e476]: 到目前为止，这一策略在 OpenAI 的内部发布和采纳过程中表现良好。为真实用户打造真实产品，帮助我们将投资锚定在现实中，并引导我们实现长期的可维护性。
          - paragraph [ref=e478]: 我们尚不清楚的是，在一个完全由智能体生成的系统中，架构连贯性会如何随着时间的推移而演变。我们仍在学习人类的判断力在哪些方面能发挥最大作用，以及如何对这种判断力进行编码，使其发挥更大作用。我们也不知道，随着时间的推移，模型的功能不断增强，这一系统将如何演变。
          - paragraph [ref=e480]: 显而易见的是：构建软件仍然需要纪律，但纪律更多地体现在支撑结构上，而不是代码上。保持代码库一致性的工具、抽象和反馈回路变得越发重要。
          - paragraph [ref=e482]:
            - generic [ref=e483]: 我们当前最棘手的挑战集中在设计环境、反馈回路和控制系统方面
            - text: ，帮助智能体实现我们的目标：大规模构建和维护复杂、可靠的软件。
          - paragraph [ref=e485]:
            - text: 随着像 Codex 这样的智能体在软件生命周期中占据越来越大的比重，这些问题将变得更加重要。我们希望通过分享一些早期的经验教训，帮助你理清投入精力的方向，以便
            - link "你可以直接开始构建" [ref=e486] [cursor=pointer]:
              - /url: /zh-Hans-CN/codex/
              - generic [ref=e487]: 你可以直接开始构建
            - text: 。
