        - generic [ref=e98]:
          - paragraph [ref=e100]:
            - text: 在过去五个月里，我们的团队一直在进行一项实验：构建并交付一款软件产品的内部 beta 版，
            - generic [ref=e101]: 其中没有一行代码是人工编写的
            - text: 。
          - paragraph [ref=e103]: 该产品有内部日常活跃用户和外部 Alpha 测试者。它经历了交付、部署、故障和修复的整个过程。与众不同的是，每一行代码 — 从应用逻辑、测试、CI 配置、文档、可观察性到内部工具 — 全都是由 Codex 编写的。据估计，我们只用了手工编写代码所需的大约 1/10 的时间就完成了这项工作。
          - paragraph [ref=e105]:
            - generic [ref=e106]: 人类掌舵。智能体执行。
          - paragraph [ref=e108]: 我们有意选择这一限制，以便构建必要的内容，从而将工程速度提升数个数量级。我们用了几周的时间来交付最终达到一百万行代码的项目。为此，我们需要了解，当软件工程团队的主要工作不再是编写代码，而是设计环境、明确意图和构建反馈回路，从而使 Codex 智能体能够可靠地工作时，会发生哪些变化。
          - paragraph [ref=e110]: 这个帖子要说的是，在我们与智能体团队一起从零开始打造一款全新产品的过程中，所能学到的经验教训 — 哪些地方出了问题，哪些问题相互叠加，以及如何最大化利用我们唯一真正稀缺的资源：人类的时间和注意力。
          - heading "我们从一个空的 Git 代码仓库开始" [level=2] [ref=e114]
          - paragraph [ref=e116]: 首次提交到一个空的代码仓库是在 2025 年 8 月下旬。
          - paragraph [ref=e118]: 初始架构 — 包括代码仓库结构、CI 配置、格式化规则、包管理器设置和应用框架 — 是在一小套现有模板的指导下，由 Codex CLI 使用 GPT‑5 生成的。就连指导智能体如何在代码仓库中工作的初始 AGENTS.md 文件本身也是由 Codex 编写的。
          - paragraph [ref=e120]: 该系统没有预存任何人工编写的代码。从一开始，代码仓库就由智能体塑造。
          - paragraph [ref=e122]:
            - text: 五个月后，该代码仓库已经拥有约一百万行代码，从应用逻辑、基础设施、工具、文档到内部开发者工具应有尽有。在那段时间内，大约有 1,500 个 Pull Request 被打开与合并，而推动 Codex 的仅仅是一个由三名工程师组成的小团队。这相当于平均每位工程师每天处理 3.5 个 PRs 的吞吐量，而且令人惊讶的是，随着团队规模扩大到现在的七名工程师，吞吐量甚至还
            - generic [ref=e123]: 增加
            - text: 了。重要的是，这并非为了输出而输出：该产品已在数百名内测用户那里投入使用，其中包括每天都在使用的内测高级用户。
          - paragraph [ref=e125]:
            - text: 在整个开发过程中，人类从未直接直接贡献过任何代码。这成为团队的核心理念：
            - generic [ref=e126]: 不手动编写代码
            - text: 。
          - heading "重新定义工程师的角色" [level=2] [ref=e130]
          - paragraph [ref=e132]:
            - text: 由于缺乏人工编码的实践，
            - generic [ref=e133]: 工程师工作的重点转向了系统、架构和杠杆作用
            - text: 。
          - paragraph [ref=e135]: 早期进展比我们所预期的要慢，而这并不是因为 Codex 不具备相应的能力，而是因为环境的规范不够明确。该智能体缺乏实现高级目标所需的工具、抽象层和内部结构，因而无法取得进展。我们工程团队的主要任务成了协助智能体完成有用的工作。
          - paragraph [ref=e137]: 在实践中，这意味着采用深度优先的工作方式：将更大的目标拆解为更小的构建模块（设计、代码、评审、测试等），提示智能体去构建这些模块，并使用它们去解锁更复杂的任务。当事情进行不顺利时，解决方案基本上再也不会是“再努力一点”。因为取得进展的唯一方式是让 Codex 来完成工作，而人类工程师则总是介入这项任务并追问：“究竟还需要什么样的能力，我们又该如何让这个能力对智能体来说既清晰可读又可强制执行？”
          - paragraph [ref=e139]:
            - text: 人类几乎完全通过提示与系统交互：工程师描述任务，运行智能体，并允许其打开一个 Pull Request。为了推动 PR 的完成，我们会指示 Codex 在本地审核其自身的更改，在本地和云端请求额外的特定智能体审查，对任何人工或智能体给出的反馈做出响应，并循环往复，直到所有智能体审核人员都满意为止（这实际上是一个
            - link "Ralph Wiggum 循环⁠ （在新窗口中打开）" [ref=e140] [cursor=pointer]:
              - /url: https://ghuntley.com/loop/
              - generic [ref=e141]: Ralph Wiggum 循环
              - text: ⁠
              - generic [ref=e142]: （在新窗口中打开）
            - text: ）。Codex 直接使用我们的标准开发工具（gh、本地脚本和嵌入代码仓库的技能）来收集情境，而无需人工将内容复制粘贴到 CLI 中。
          - paragraph [ref=e144]: 人类可以审核 Pull Request（合并请求），但并非必须这样做。随着时间的推移，我们已将几乎所有的审核工作调整为用智能体对智能体的方式来处理。
          - heading "提高应用程序的可读性" [level=2] [ref=e148]
          - paragraph [ref=e150]: 随着代码吞吐量的增加，我们的瓶颈变成了人工 QA 能力。由于人类的时间和注意力是固定的限制因素，我们一直在努力通过令应用程序的 UI、日志和应用指标等内容对 Codex 直接可读，从而为智能体增加更多功能。
          - paragraph [ref=e152]: 例如，我们令应用程序可以根据 git worktree 启动，因此 Codex 可以为每次更改启动并驱动一个实例。我们还将 Chrome DevTools 协议接入智能体运行时，并创建了用于处理 DOM 快照、屏幕截图和导航的技能。这使 Codex 能够复现错误、验证修复，并直接推理 UI 的行为。
          - figure [ref=e154]:
            - img "题为“Codex 使用 Chrome DevTools MCP 驱动应用程序以验证其工作”的图表。Codex 会选择一个目标，对触发用户界面路径前后的状态进行快照，通过 Chrome DevTools 观察运行时事件，应用修复、重启和循环重新运行验证，直到应用程序恢复正常。" [ref=e162]
          - paragraph [ref=e164]: 我们对可观测性工具也做了同样的处理。日志、指标和追踪记录会通过一个本地可观测性堆栈展示给 Codex，对任何给定的工作树来说，该堆栈都是临时的。Codex 在该应用程序的一个完全独立的版本上运行，一旦任务完成，该版本的所有内容，包括日志和指标，都会被删除。智能体可以使用 LogQL 查询日志，使用 PromQL 查询指标。有了这些情境，像“确保服务启动在 800ms 内完成”或“这四个关键用户旅程中的任何跨度都不得超过两秒”这样的提示就变得可行了。
          - figure [ref=e166]:
            - img "题为“在本地开发中赋予 Codex 完整的可观察性堆栈”的图表。一个应用程序将日志、指标和追踪数据发送到 Vector，Vector 会将数据分发到一个包含 Victoria Logs、Metrics 和 Traces 的可观测性堆栈中，并通过 LogQL、PromQL 或 TraceQL API 进行查询。Codex 使用这些信号进行查询、关联和推理，然后在代码库中进行修复，重启应用程序，重新运行工作负载，测试 UI 流程，并在反馈循环中重复此过程。" [ref=e174]
          - paragraph [ref=e176]: 我们经常看到单次 Codex 运行在单个任务上持续工作超过六个小时（通常是在人类睡眠时间）。
          - heading "我们将代码仓库设为记录系统" [level=2] [ref=e180]
          - paragraph [ref=e182]:
            - text: 情境管理是使智能体在大型和复杂任务中有效发挥作用的最大挑战之一。我们学到的最早经验教训之一很简单：
            - generic [ref=e183]: 要给 Codex 的是一张地图，而不是一本 1,000 页的说明书。
          - paragraph [ref=e185]:
            - text: 我们尝试了“一个大型的
