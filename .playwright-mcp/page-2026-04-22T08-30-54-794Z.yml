          - list [ref=e552]:
            - listitem [ref=e553]:
              - paragraph [ref=e554]:
                - strong [ref=e555]: How is data privacy maintained for caches?
              - paragraph [ref=e556]: Prompt caches are not shared between organizations. Only members of the same organization can access caches of identical prompts.
            - listitem [ref=e557]:
              - paragraph [ref=e558]:
                - strong [ref=e559]: Does Prompt Caching affect output token generation or the final response of the API?
              - paragraph [ref=e560]: Prompt Caching does not influence the generation of output tokens or the final response provided by the API. Regardless of whether caching is used, the output generated will be identical. This is because only the prompt itself is cached, while the actual response is computed anew each time based on the cached prompt.
            - listitem [ref=e561]:
              - paragraph [ref=e562]:
                - strong [ref=e563]: Is there a way to manually clear the cache?
              - paragraph [ref=e564]: Manual cache clearing is not currently available. Prompts that have not been encountered recently are automatically cleared from the cache. Typical cache evictions occur after 5-10 minutes of inactivity, though sometimes lasting up to a maximum of one hour during off-peak periods.
            - listitem [ref=e565]:
              - paragraph [ref=e566]:
                - strong [ref=e567]: Will I be expected to pay extra for writing to Prompt Caching?
              - paragraph [ref=e568]: No. Caching happens automatically, with no explicit action needed or extra cost paid to use the caching feature.
            - listitem [ref=e569]:
              - paragraph [ref=e570]:
                - strong [ref=e571]: Do cached prompts contribute to TPM rate limits?
              - paragraph [ref=e572]: Yes, as caching does not affect rate limits.
            - listitem [ref=e573]:
              - paragraph [ref=e574]:
                - strong [ref=e575]: Does Prompt Caching work on Zero Data Retention requests?
              - paragraph [ref=e576]:
                - text: In-memory cache retention does not save any data to disk. Extended prompt caching may store key/value tensors in GPU-local storage, and the key-value tensors are derived from customer content. This data is not retained beyond cache expiration — the key-value tensors are retained for 1-2 hours (most usage) and at most 24 hours. Extended prompt caching requests are not blocked if Zero Data Retention is enabled for your project. Other Zero Data Retention still applies, such as excluding customer content from abuse logs and preventing use of
                - code [ref=e577]: store=True
                - text: . See the
                - link "Your data" [ref=e578] [cursor=pointer]:
                  - /url: /api/docs/guides/your-data
                - text: guide for more context on Zero Data Retention.
            - listitem [ref=e579]:
              - paragraph [ref=e580]:
                - strong [ref=e581]: Does Prompt Caching work with Data Residency?
              - paragraph [ref=e582]: In-memory Prompt Caching is compatable with all Data Residency regions.
              - paragraph [ref=e583]: Extended caching temporarily stores data on GPU machines and will only be kept in-region when using Regional Inference.