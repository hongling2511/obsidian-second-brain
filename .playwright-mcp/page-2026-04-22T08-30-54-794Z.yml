    - main [ref=e367]:
      - generic [ref=e370]:
        - generic [ref=e372]:
          - heading "Prompt caching" [level=1] [ref=e373]
          - paragraph [ref=e374]: Reduce latency and cost with prompt caching.
          - button "Copy Page" [ref=e377] [cursor=pointer]:
            - img [ref=e379]
            - generic [ref=e381]: Copy Page
        - article [ref=e382]:
          - paragraph [ref=e383]:
            - text: Model prompts often contain repetitive content, like system prompts and common instructions. OpenAI routes API requests to servers that recently processed the same prompt, making it cheaper and faster than processing a prompt from scratch. Prompt Caching can reduce latency by up to 80% and input token costs by up to 90%. Prompt Caching works automatically on all your API requests (no code changes required) and has no additional fees associated with it. Prompt Caching is enabled for all recent
            - link "models" [ref=e384] [cursor=pointer]:
              - /url: /api/docs/models
            - text: ", gpt-4o and newer."
          - paragraph [ref=e385]: This guide describes how Prompt Caching works in detail, so that you can optimize your prompts for lower latency and cost.
          - heading "Structuring prompts Copy link to structuring prompts" [level=2] [ref=e386]:
            - generic [ref=e387]: Structuring prompts
            - button "Copy link to structuring prompts" [ref=e388] [cursor=pointer]:
              - img [ref=e389]
          - paragraph [ref=e391]: Cache hits are only possible for exact prefix matches within a prompt. To realize caching benefits, place static content like instructions and examples at the beginning of your prompt, and put variable content, such as user-specific information, at the end. This also applies to images and tools, which must be identical between requests.
          - paragraph [ref=e392]:
            - img "Prompt Caching visualization" [ref=e393]
          - heading "How it works Copy link to how it works" [level=2] [ref=e394]:
            - generic [ref=e395]: How it works
            - button "Copy link to how it works" [ref=e396] [cursor=pointer]:
              - img [ref=e397]
          - paragraph [ref=e399]: "Caching is enabled automatically for prompts that are 1024 tokens or longer. When you make an API request, the following steps occur:"
          - list [ref=e400]:
            - listitem [ref=e401]:
              - strong [ref=e402]: Cache Routing
              - text: ":"
          - list [ref=e403]:
            - listitem [ref=e404]: Requests are routed to a machine based on a hash of the initial prefix of the prompt. The hash typically uses the first 256 tokens, though the exact length varies depending on the model.
            - listitem [ref=e405]:
              - text: If you provide the
              - link "prompt_cache_key" [ref=e406] [cursor=pointer]:
                - /url: /api/docs/api-reference/responses/create#responses-create-prompt_cache_key
                - code [ref=e407]: prompt_cache_key
              - text: parameter, it is combined with the prefix hash, allowing you to influence routing and improve cache hit rates. This is especially beneficial when many requests share long, common prefixes.
            - listitem [ref=e408]:
              - text: If requests for the same prefix and
              - code [ref=e409]: prompt_cache_key
              - text: combination exceed a certain rate (approximately 15 requests per minute), some may overflow and get routed to additional machines, reducing cache effectiveness.
          - list [ref=e410]:
            - listitem [ref=e411]:
              - strong [ref=e412]: Cache Lookup
              - text: ": The system checks if the initial portion (prefix) of your prompt exists in the cache on the selected machine."
            - listitem [ref=e413]:
              - strong [ref=e414]: Cache Hit
              - text: ": If a matching prefix is found, the system uses the cached result. This significantly decreases latency and reduces costs."
            - listitem [ref=e415]:
              - strong [ref=e416]: Cache Miss
              - text: ": If no matching prefix is found, the system processes your full prompt, caching the prefix afterward on that machine for future requests."
          - heading "Prompt cache retention Copy link to prompt cache retention" [level=2] [ref=e417]:
            - generic [ref=e418]: Prompt cache retention
            - button "Copy link to prompt cache retention" [ref=e419] [cursor=pointer]:
              - img [ref=e420]
          - paragraph [ref=e422]: Prompt Caching can either use in-memory or extended retention policies. When available, Extended Prompt Caching aims to retain the cache for longer, so that subsequent requests are more likely to match the cache.
          - paragraph [ref=e423]: Prompt cache pricing is the same for both retention policies.
          - paragraph [ref=e424]:
            - text: To configure the prompt cache retention policy, set the
            - code [ref=e425]: prompt_cache_retention
            - text: parameter on your
            - code [ref=e426]: Responses.create
            - text: request (or
            - code [ref=e427]: chat.completions.create
            - text: if using Chat Completions).
          - heading "In-memory prompt cache retention Copy link to in memory prompt cache retention" [level=3] [ref=e428]:
            - generic [ref=e429]: In-memory prompt cache retention
            - button "Copy link to in memory prompt cache retention" [ref=e430] [cursor=pointer]:
              - img [ref=e431]
          - paragraph [ref=e433]: In-memory prompt cache retention is available for all models that support Prompt Caching.
          - paragraph [ref=e434]: When using the in-memory policy, cached prefixes generally remain active for 5 to 10 minutes of inactivity, up to a maximum of one hour. In-memory cached prefixes are only held within volatile GPU memory.
          - heading "Extended prompt cache retention Copy link to extended prompt cache retention" [level=3] [ref=e435]:
            - generic [ref=e436]: Extended prompt cache retention
            - button "Copy link to extended prompt cache retention" [ref=e437] [cursor=pointer]:
              - img [ref=e438]
          - paragraph [ref=e440]: "Extended prompt cache retention is available for the following models:"
          - list [ref=e441]:
            - listitem [ref=e442]: gpt-5.4
            - listitem [ref=e443]: gpt-5.2
            - listitem [ref=e444]: gp5-5.1-codex-max
            - listitem [ref=e445]: gpt-5.1
            - listitem [ref=e446]: gpt-5.1-codex
            - listitem [ref=e447]: gpt-5.1-codex-mini
            - listitem [ref=e448]: gpt-5.1-chat-latest
            - listitem [ref=e449]: gpt-5
            - listitem [ref=e450]: gpt-5-codex
            - listitem [ref=e451]: gpt-4.1
          - paragraph [ref=e452]: Extended prompt cache retention keeps cached prefixes active for longer, up to a maximum of 24 hours. Extended Prompt Caching works by offloading the key/value tensors to GPU-local storage when memory is full, significantly increasing the storage capacity available for caching.
          - paragraph [ref=e453]: key/value tensors are the intermediate representation from the model’s attention layers produced during prefill. Only the key/value tensors may be persisted in local storage; the original customer content, such as prompt text, is only retained in memory.
