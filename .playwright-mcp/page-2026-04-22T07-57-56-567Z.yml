            - heading "深入了解 OpenAI 的内部数据智能体" [level=1] [ref=e75]
            - paragraph [ref=e77]: 作者：Bonnie Xu、Aravind Suresh 和 Emma Tang
          - generic [ref=e79]:
            - generic [ref=e82]:
